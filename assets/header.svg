<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7ee787;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#39d353;stop-opacity:0.25"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <circle cx="150" cy="80" r="60" fill="#58a6ff" opacity="0.06"/>
  <circle cx="1050" cy="200" r="90" fill="#bc8cff" opacity="0.06"/>
  <circle cx="600" cy="140" r="120" fill="#39d353" opacity="0.04"/>
  <text x="600" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e6edf3" filter="url(#glow)">k69ly</text>
  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#8b949e">Full-Stack &#8226; Flutter &#8226; Banking Network</text>
  <path fill="url(#wave1)" opacity="0.9">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,200 C200,160 400,240 600,200 C800,160 1000,240 1200,200 L1200,280 L0,280 Z;
              M0,200 C200,240 400,160 600,200 C800,240 1000,160 1200,200 L1200,280 L0,280 Z;
              M0,200 C200,160 400,240 600,200 C800,160 1000,240 1200,200 L1200,280 L0,280 Z"/>
  </path>
  <path fill="url(#wave2)" opacity="0.7">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,220 C300,180 500,260 700,220 C900,180 1100,260 1200,220 L1200,280 L0,280 Z;
              M0,220 C300,260 500,180 700,220 C900,260 1100,180 1200,220 L1200,280 L0,280 Z;
              M0,220 C300,180 500,260 700,220 C900,180 1100,260 1200,220 L1200,280 L0,280 Z"/>
  </path>
  <line x1="200" y1="250" x2="1000" y2="250" stroke="#30363d" stroke-width="1"/>
</svg>
